name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The bridge is for Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The version is packageManager's in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Includes the type check.
      - run: pnpm build
